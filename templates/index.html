<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codyssey B7-1 AI Chatbot</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!--
    [권태현 전담] 웹 챗봇 단일 페이지 인터페이스
    질문 입력과 AI 응답을 같은 화면의 말풍선으로 보여줍니다.
  -->
  <header class="app-header">
    <h1 class="app-title">Codyssey B7-1 AI 챗봇</h1>
    <div id="auth-info" class="auth-info"></div>
  </header>

  <div class="app-body">
    <main class="chat-panel">
      <section id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-label="대화 내용">
        <div class="message assistant welcome">안녕하세요! 궁금한 점을 입력하면 AI가 답변해 드려요.</div>
      </section>

      <!-- 비로그인 상태가 기본: 로그인이 확인되면 app.js가 안내를 숨기고 입력창을 풀어줌 -->
      <div id="login-notice" class="login-notice">
        <span>🔒 챗봇은 로그인한 사용자만 이용할 수 있어요.</span>
        <span class="login-notice-actions">
          <button type="button" class="btn btn-secondary" data-open-modal="login">로그인</button>
          <button type="button" class="btn btn-primary" data-open-modal="register">회원가입</button>
        </span>
      </div>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <label for="chat-input" class="visually-hidden">질문 입력</label>
        <textarea id="chat-input" name="prompt" rows="1" placeholder="🔒 로그인 후 질문을 입력할 수 있습니다." disabled></textarea>
        <button type="submit" id="send-btn" class="btn btn-primary send-btn" disabled>전송</button>
        <div class="chat-form-footer">
          <p id="input-hint" class="input-hint" role="alert" hidden></p>
          <span id="char-count" class="char-count">0 / 1000</span>
        </div>
      </form>
    </main>
  </div>

  <dialog id="auth-modal" class="modal" aria-labelledby="auth-modal-title">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="auth-modal-title" class="modal-title">Codyssey 챗봇 계정</h2>
        <button type="button" class="icon-btn" data-close-modal aria-label="닫기">✕</button>
      </div>

      <div class="modal-tabs" role="tablist" aria-label="로그인 또는 회원가입">
        <button type="button" id="tab-login" class="modal-tab" role="tab" data-auth-mode="login" aria-controls="login-form" aria-selected="true">로그인</button>
        <button type="button" id="tab-register" class="modal-tab" role="tab" data-auth-mode="register" aria-controls="register-form" aria-selected="false">회원가입</button>
      </div>

      <form id="login-form" class="auth-form" role="tabpanel" aria-labelledby="tab-login">
        <label>
          <span class="field-label">아이디</span>
          <input name="username" type="text" autocomplete="username" required>
        </label>
        <label>
          <span class="field-label">비밀번호</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="login-message" class="form-message" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary">로그인</button>
      </form>

      <form id="register-form" class="auth-form" role="tabpanel" aria-labelledby="tab-register" hidden>
        <label>
          <span class="field-label">아이디 <span class="field-hint">3~50자</span></span>
          <input name="username" type="text" autocomplete="username" minlength="3" maxlength="50" required>
        </label>
        <label>
          <span class="field-label">비밀번호 <span class="field-hint">4~100자</span></span>
          <input name="password" type="password" autocomplete="new-password" minlength="4" maxlength="100" required>
        </label>
        <label>
          <span class="field-label">비밀번호 확인</span>
          <input name="passwordConfirm" type="password" autocomplete="new-password" minlength="4" maxlength="100" required>
        </label>
        <p id="register-message" class="form-message" aria-live="polite"></p>
        <button type="submit" class="btn btn-primary">회원가입</button>
      </form>
    </div>
  </dialog>

  <script src="/static/js/app.js"></script>
</body>
</html>
